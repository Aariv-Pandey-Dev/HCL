<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Track groceries, catch expiry dates and cut food waste. The AI adds online grocery orders automatically.">
<meta name="theme-color" content="#EDF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Grocery Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
<style>
/*
  Grocery Tracker — "inside the fridge".
  Cool fridge-liner background, white shelves, ink line drawings with one soft tint.
  Colour is kept for meaning: red/orange/yellow/green stickers say how soon food needs using. Jamun purple marks actions.
  One typeface (Bricolage Grotesque): narrow and bold for titles and numbers, like a printed food label.
*/
:root{
  --bg:#EDF2F0; --paper:#FFFFFF; --sunk:#E2E9E6; --line:#D2DCD8; --line-strong:#A7B5B0;
  --ink:#1A2421; --muted:#53625D; --faint:#7B8984;
  --accent:#6E2C63; --on-accent:#FFFFFF; --accent-soft:#F2E4EF; --on-accent-soft:#4A1A42;
  --draw:#1A2421; --draw-fill:#E6DCE4; --draw-paper:#FFFFFF;
  --snack:#1A2421; --on-snack:#EDF2F0; --snack-action:#E9BCE0;
  --exp:#B3261E; --exp-bg:#FBE9E6; --exp-solid:#DB3A2C; --exp-on:#FFFFFF;
  --week:#994700; --week-bg:#FDEEE0; --week-solid:#F0801A; --week-on:#2A1400;
  --month:#765300; --month-bg:#FDF3D8; --month-solid:#F4B92A; --month-on:#261A00;
  --fresh:#1D6B36; --fresh-bg:#E3F2E8; --fresh-solid:#2F8F4E; --fresh-on:#FFFFFF;
  --none:#53625D; --none-fill:#FFFFFF;
  --scrim:rgba(14,22,20,.42);
  --f:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121816; --paper:#1B2320; --sunk:#232C29; --line:#2C3733; --line-strong:#4B5A55;
    --ink:#E3EBE8; --muted:#A3B1AC; --faint:#7D8B86;
    --accent:#E3B2D8; --on-accent:#3A1233; --accent-soft:#3A2636; --on-accent-soft:#F6DFF0;
    --draw:#DCE5E2; --draw-fill:#3B2D38; --draw-paper:#1B2320;
    --snack:#E3EBE8; --on-snack:#1A2421; --snack-action:#6E2C63;
    --exp:#F4A9A2; --exp-bg:#3A1C19; --exp-solid:#F0796E; --exp-on:#3A0B07;
    --week:#F8C08F; --week-bg:#382614; --week-solid:#F7A55C; --week-on:#331800;
    --month:#F6D98A; --month-bg:#342C12; --month-solid:#F6CD5E; --month-on:#2E2300;
    --fresh:#8FD3A6; --fresh-bg:#16301F; --fresh-solid:#6CC48A; --fresh-on:#062411;
    --none:#A3B1AC; --none-fill:#121816;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121816; --paper:#1B2320; --sunk:#232C29; --line:#2C3733; --line-strong:#4B5A55;
  --ink:#E3EBE8; --muted:#A3B1AC; --faint:#7D8B86;
  --accent:#E3B2D8; --on-accent:#3A1233; --accent-soft:#3A2636; --on-accent-soft:#F6DFF0;
  --draw:#DCE5E2; --draw-fill:#3B2D38; --draw-paper:#1B2320;
  --snack:#E3EBE8; --on-snack:#1A2421; --snack-action:#6E2C63;
  --exp:#F4A9A2; --exp-bg:#3A1C19; --exp-solid:#F0796E; --exp-on:#3A0B07;
  --week:#F8C08F; --week-bg:#382614; --week-solid:#F7A55C; --week-on:#331800;
  --month:#F6D98A; --month-bg:#342C12; --month-solid:#F6CD5E; --month-on:#2E2300;
  --fresh:#8FD3A6; --fresh-bg:#16301F; --fresh-solid:#6CC48A; --fresh-on:#062411;
  --none:#A3B1AC; --none-fill:#121816;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:24px;font-optical-sizing:auto;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
h1{font-size:30px;line-height:34px;font-weight:720;font-variation-settings:"wdth" 80;letter-spacing:-.2px}
h2{font-size:22px;line-height:28px;font-weight:660;font-variation-settings:"wdth" 86}
h3{font-size:16px;line-height:22px;font-weight:620}
.ic{width:22px;height:22px;flex:none;display:block}
.app{max-width:36rem;margin:0 auto}
.gut{--gl:max(18px,env(safe-area-inset-left,0px));--gr:max(18px,env(safe-area-inset-right,0px));padding-left:var(--gl);padding-right:var(--gr)}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:20px}

/* header */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);min-height:68px;padding-block:14px 10px;display:flex;align-items:center;gap:10px}
.bar-top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-tag{font-size:13px;line-height:18px;font-weight:650;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:2px 8px;transform:rotate(-3deg)}
.add-btn{height:40px;padding:0 14px 0 10px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line-strong);display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:620;color:var(--ink)}
.add-btn .ic{width:20px;height:20px}
main{padding-block:0 calc(var(--nav) + 40px + env(safe-area-inset-bottom,0px))}

/* drawings */
.draw .ln{fill:none;stroke:var(--draw);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.draw .tf{fill:var(--draw-fill)}
.draw .pp{fill:var(--draw-paper)}
.draw .dot{fill:var(--draw)}
.draw .sk{fill:var(--sunk)}
.draw text{font-family:var(--f);font-size:11px;font-weight:650;fill:var(--muted)}
.art{width:48px;height:48px;flex:none;border-radius:14px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}
.art svg{width:36px;height:36px;display:block}

/* fridge summary */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 146px;gap:8px 18px;align-items:end;padding:6px 0 18px}
.hero .fridge{width:146px;height:auto;display:block}
.hero-t{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-bottom:6px}
.hero .big{font-size:76px;line-height:68px;font-weight:760;font-variation-settings:"wdth" 75;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.hero .big.b-expired{color:var(--exp)}
.hero .lead{font-size:18px;line-height:24px;font-weight:560;max-width:12ch}
.hero .btn{margin-top:12px}
.tally{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;line-height:20px;color:var(--muted)}
.tally b{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:14px;line-height:20px;color:var(--muted)}

/* colour key filters */
.keys{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 2px var(--gl)}
.keys::-webkit-scrollbar{display:none}
.key{flex:none;height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 12px 0 10px;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;line-height:20px;font-weight:560;white-space:nowrap}
.key .shp{width:16px;height:16px;flex:none;overflow:visible}
.key .n{color:var(--faint);font-variant-numeric:tabular-nums}
.key.on{background:var(--ink);color:var(--bg);box-shadow:none}
.key.on .n{color:var(--bg);opacity:.7}
.key.k-all{padding-left:12px}
.tools{display:flex;flex-direction:column;gap:12px;padding-bottom:4px}

/* search */
.search{display:flex;align-items:center;gap:10px;height:44px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;color:var(--faint)}
.search .ic{width:20px;height:20px}
.search input{flex:1;min-width:0;border:0;background:none;height:100%;font-size:16px;color:var(--ink);outline:none;padding:0}
.search input::placeholder{color:var(--faint)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}

/* sections & lists */
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:28px;padding-bottom:6px;font-size:15px;line-height:20px;font-weight:650;color:var(--ink)}
.sec-h .acts-inline{display:flex;gap:2px;margin-right:-10px}
.band-h{justify-content:flex-start;gap:10px}
.band-h .shp{width:18px;height:18px;flex:none;overflow:visible}
.band-h .c{margin-left:auto;color:var(--faint);font-weight:560;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.list>li+li{border-top:1px solid var(--line)}
.it{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:72px;padding-block:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:12px}
.it:active{background:var(--sunk)}
.it .nm{display:block;font-size:17px;line-height:22px;font-weight:580;overflow-wrap:anywhere}
.it .sp{display:block;font-size:14px;line-height:20px;color:var(--muted);margin-top:2px}
.it .sp .bad{color:var(--exp);font-weight:600}
.tag{position:relative;width:42px;height:42px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tc);line-height:1}
.tag>.shp{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tag b,.tag i{position:relative}
.tag b{font-size:17px;font-weight:760;font-variation-settings:"wdth" 80;font-variant-numeric:tabular-nums}
.tag i{font-style:normal;font-size:10px;font-weight:600;margin-top:1px}
.shp .f{fill:var(--c)}
.shp .f.st{stroke:var(--c);stroke-width:3;stroke-linejoin:round}
.k-none .shp .f,.t-none .shp .f,.k-none.shp .f{fill:var(--none-fill);stroke:var(--line-strong);stroke-width:2}
.t-expired,.k-expired{--c:var(--exp-solid);--tc:var(--exp-on)} .t-week,.k-week{--c:var(--week-solid);--tc:var(--week-on)} .t-month,.k-month{--c:var(--month-solid);--tc:var(--month-on)} .t-fresh,.k-fresh{--c:var(--fresh-solid);--tc:var(--fresh-on)} .t-none{--tc:var(--none)}
.row{width:100%;display:flex;align-items:center;gap:14px;min-height:56px;padding-block:8px;font-size:16px;line-height:22px;text-align:left}
.row .t{flex:1;min-width:0}
.row .t small{display:block;font-size:14px;line-height:20px;color:var(--muted);margin-top:2px}
.row>.ic{color:var(--muted)}
.row.link{cursor:pointer}
.row.danger,.row.danger .ic{color:var(--exp)}
.rows{list-style:none;margin:0;padding:0}
.rows>*+*{border-top:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.foot{font-size:13px;line-height:18px;color:var(--faint);text-align:center;padding-top:28px}
.foot .btn{margin-top:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:15px;line-height:20px;font-weight:640;white-space:nowrap}
.btn .ic{width:20px;height:20px;margin-left:-4px}
.btn.wide{width:100%;height:50px;font-size:16px}
.btn.outline{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn.tonal{background:var(--accent-soft);color:var(--on-accent-soft)}
.btn.text{background:none;color:var(--accent);padding:0 10px;height:40px}
.btn.danger{background:var(--paper);color:var(--exp);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn:active{filter:brightness(.94)}
.btn[disabled]{opacity:.4;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.row .t small.acct{color:var(--ink);overflow-wrap:anywhere}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--sunk)}

/* fields */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:14px;line-height:20px;font-weight:560;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--paper);padding:0 14px;font-size:16px;color:var(--ink)}
select{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;background-size:5px 5px;background-repeat:no-repeat}
textarea{height:auto;min-height:116px;padding:12px 14px;line-height:22px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
::placeholder{color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inline{display:flex;gap:6px;align-items:flex-end}
.inline>.field{flex:1}
.inline .btn{height:48px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;line-height:20px;min-height:40px}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.hint{font-size:13px;line-height:18px;color:var(--muted)}
.hint.good{color:var(--fresh)}
.err{font-size:14px;line-height:20px;color:var(--exp)}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;margin:0;border-radius:14px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line-strong);position:relative;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent);box-shadow:none}
.switch:checked::after{transform:translateX(18px);background:var(--on-accent)}

/* small chips (quick add, ingredients) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;line-height:20px;font-weight:540;white-space:nowrap}
.chip .shp{width:16px;height:16px;flex:none;overflow:visible}
.chip .ic{width:18px;height:18px;margin-left:-2px}
.chip.on{background:var(--accent-soft);color:var(--on-accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip.on .ic{color:var(--accent)}

/* progress */
.job{display:flex;align-items:center;gap:14px;min-height:56px;font-size:15px;line-height:20px;color:var(--muted)}
.job p{flex:1;min-width:0}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* empty & locked */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 8px 16px}
.empty .ill{width:180px;height:auto;margin-bottom:8px}
.empty .ill.fridge{width:120px}
.empty p{font-size:15px;line-height:22px;color:var(--muted);max-width:30ch}
.empty .btn{margin-top:6px}
.empty .btn+.btn{margin-top:0}
.perks{list-style:none;margin:8px 0 4px;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:20px}
.perks li{display:flex;gap:10px;align-items:flex-start}
.perks .ic{width:20px;height:20px;color:var(--fresh)}

/* imports */
.imp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:18px}
.imp-h b{font-size:15px;line-height:20px;font-weight:650}
.imp-h span{font-size:13px;line-height:18px;color:var(--faint);white-space:nowrap}
.dec{list-style:none;margin:0;padding:0}
.dec li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:56px;padding-block:6px}
.dec li+li{border-top:1px solid var(--line)}
.dec .ic{width:20px;height:20px}
.dec .yes .ic{color:var(--fresh)}
.dec .no .ic{color:var(--faint)}
.dec .nm{display:block;font-size:16px;line-height:22px;overflow-wrap:anywhere}
.dec .no .nm{color:var(--muted)}
.dec small{display:block;font-size:13px;line-height:18px;color:var(--muted)}

/* recipes */
.rec{display:flex;flex-direction:column;gap:12px;padding-top:28px}
.rec-head{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 16px;align-items:start;padding-top:20px;border-top:2px solid var(--ink)}
.rec-head .art{width:64px;height:64px;border-radius:18px;grid-row:span 3}
.rec-head .art svg{width:48px;height:48px}
.rec-head h2{font-size:26px;line-height:30px;font-weight:720;font-variation-settings:"wdth" 80}
.rec-head p{grid-column:2}
.rec-why{font-size:16px;line-height:24px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:10px;font-size:16px;line-height:22px}
.ing li+li{border-top:1px solid var(--line)}
.ing .st{font-size:13px;line-height:18px;font-weight:620;white-space:nowrap;border-radius:6px;padding:1px 7px}
.st-have{color:var(--fresh);background:var(--fresh-bg)} .st-missing{color:var(--week);background:var(--week-bg)} .st-staple{color:var(--muted);background:var(--sunk)}
.steps{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:24px}
.steps li{padding-left:6px}
.steps li::marker{color:var(--accent);font-weight:720}
.verdict{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--vb)}
.verdict.order{--vb:var(--week-bg);--vc:var(--week)}
.verdict.no_need{--vb:var(--fresh-bg);--vc:var(--fresh)}
.verdict .vd{font-size:22px;line-height:28px;font-weight:720;font-variation-settings:"wdth" 82;color:var(--vc)}
.verdict p,.verdict li{font-size:15px;line-height:22px}
.verdict .lbl{font-size:14px;line-height:20px;font-weight:650;margin-top:6px}
.buy{margin:0;padding-left:18px}
.verdict .btn{align-self:flex-start;margin-left:-10px}

/* plans */
.plans{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{position:relative;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);border-radius:16px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:2px}
.plan.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.plan .pn{font-size:16px;line-height:22px;font-weight:650}
.plan .pp{font-size:30px;line-height:34px;font-weight:760;font-variation-settings:"wdth" 78;font-variant-numeric:tabular-nums}
.plan .pp small{font-size:13px;line-height:18px;font-weight:500;color:var(--muted);font-variation-settings:normal;margin-left:2px}
.plan ul{margin:8px 0 0;padding:0;list-style:none;font-size:14px;line-height:19px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

<script>
/* App version (Play Store): AI = Google Gemini through Firebase AI Logic, saving = this phone, email = Gmail API with Google sign-in. Settings live in config.js. */
window.Platform = (function () {
  'use strict';
  const CFG = window.GT_CONFIG || {};
  const LS = 'gt-state-v1';
  const P = { name: 'pwa', checkoutNote: 'In the Play Store release, real subscriptions must go through Google Play Billing.' };
  let model = null, aiError = '';

  const fbReady = () => CFG.firebase && CFG.firebase.apiKey && CFG.firebase.appId && !/PASTE/i.test(CFG.firebase.apiKey);

  P.init = async function () {
    if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('./sw.js'); } catch (e) {} }
    if (fbReady() && window.GTFirebase) {
      try {
        const F = window.GTFirebase;
        const app = F.initializeApp(CFG.firebase);
        if (CFG.recaptchaSiteKey) F.initializeAppCheck(app, { provider: new F.ReCaptchaV3Provider(CFG.recaptchaSiteKey), isTokenAutoRefreshEnabled: true });
        const ai = F.getAI(app, { backend: new F.GoogleAIBackend() });
        model = F.getGenerativeModel(ai, { model: CFG.geminiModel || 'gemini-3.5-flash', generationConfig: { responseMimeType: 'application/json', temperature: 0.4 } });
      } catch (e) { aiError = String(e && e.message || e); model = null; }
    }
    if (CFG.googleClientId) loadGIS().catch(() => {});
  };
  P.storageNote = () => 'Your list is saved on this phone. Uninstalling the app or clearing its data removes it.';
  P.load = async function () { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } };
  P.save = async function (state) { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };

  /* ---- AI via Gemini ---- */
  function parseJSON(text) {
    const t = String(text || '').trim();
    try { return JSON.parse(t); } catch (e) {}
    const fence = /```(?:json)?\s*([\s\S]*?)```/i.exec(t);
    if (fence) { try { return JSON.parse(fence[1]); } catch (e) {} }
    const a = Math.min(...['{', '['].map((c) => { const i = t.indexOf(c); return i < 0 ? Infinity : i; }));
    const b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
    if (a !== Infinity && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
    throw { code: 'invalid_json' };
  }
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject({ code: 'image_rejected' }); };
      img.src = url;
    });
  }
  P.ai = {
    get setupHint() { return fbReady() ? ('The AI assistant could not start' + (aiError ? ': ' + aiError : '.') + ' Check the Firebase settings in config.js.') : 'The AI assistant isn’t set up yet. Add your Firebase settings to config.js (see the setup guide, step 3).'; },
    available: () => !!model,
    json: async function (prompt, o) {
      if (!model) throw { code: 'not_configured' };
      const parts = [{ text: prompt }];
      if (o && o.images) for (const f of Array.from(o.images)) parts.push({ inlineData: { mimeType: 'image/jpeg', data: await shrink(f) } });
      if (o && o.signal && o.signal.aborted) throw { code: 'cancelled' };
      let res;
      try { res = await model.generateContent(parts); }
      catch (e) {
        const msg = String(e && e.message || e);
        if (/quota|429|RESOURCE_EXHAUSTED/i.test(msg)) throw { code: 'rate_limited' };
        if (/app.?check|403|PERMISSION_DENIED/i.test(msg)) throw { code: 'gemini_error', message: 'access denied — check App Check and the API key restrictions (setup guide, step 3).' };
        throw { code: 'gemini_error', message: msg.slice(0, 160) };
      }
      if (o && o.signal && o.signal.aborted) throw { code: 'cancelled' };
      return parseJSON(res.response.text());
    },
  };

  /* ---- Gmail via Google Identity Services + Gmail REST API ---- */
  let gisP = null, tok = null, acct = '';
  function loadGIS() {
    if (gisP) return gisP;
    gisP = new Promise((res, rej) => {
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => { gisP = null; rej({ code: 'gis_load' }); };
      document.head.appendChild(s);
    });
    return gisP;
  }
  async function token(interactive, pick) {
    if (!pick) {
      if (tok && tok.exp > Date.now() + 60000) return tok.value;
      try { const t = JSON.parse(sessionStorage.getItem('gt-gtok') || 'null'); if (t && t.exp > Date.now() + 60000) { tok = t; return t.value; } } catch (e) {}
    }
    if (!interactive) throw { code: 'needs_signin' };
    await loadGIS();
    return new Promise((resolve, reject) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CFG.googleClientId,
        scope: 'https://www.googleapis.com/auth/gmail.readonly',
        callback: (r) => {
          if (!r || r.error) { reject({ code: 'signin_failed', message: r && r.error }); return; }
          tok = { value: r.access_token, exp: Date.now() + (Number(r.expires_in) || 3600) * 1000 };
          try { sessionStorage.setItem('gt-gtok', JSON.stringify(tok)); } catch (e) {}
          resolve(tok.value);
        },
        error_callback: (e) => reject({ code: e && e.type === 'popup_closed' ? 'cancelled_signin' : 'signin_failed' }),
      });
      // 'select_account' makes Google show its account chooser, so the user can pick a different Gmail.
      client.requestAccessToken({ prompt: pick ? 'select_account' : '' });
    });
  }
  function signOut() {
    const old = tok && tok.value;
    tok = null; acct = '';
    try { sessionStorage.removeItem('gt-gtok'); } catch (e) {}
    // Hand the old permission back to Google so the previous account is no longer linked.
    if (old && window.google && google.accounts && google.accounts.oauth2) { try { google.accounts.oauth2.revoke(old, () => {}); } catch (e) {} }
  }
  async function gapi(path, t) {
    const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, { headers: { Authorization: 'Bearer ' + t } });
    if (r.status === 401) { tok = null; try { sessionStorage.removeItem('gt-gtok'); } catch (e) {} throw { code: 'needs_signin' }; }
    if (!r.ok) throw { code: 'gmail_http', message: String(r.status) };
    return r.json();
  }
  const b64 = (s) => { try { const bin = atob(String(s).replace(/-/g, '+').replace(/_/g, '/')); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); } catch (e) { return ''; } };
  function bodyText(part) {
    let plain = '', html = '';
    (function walk(p) {
      if (!p) return;
      if (p.mimeType === 'text/plain' && p.body && p.body.data) plain += b64(p.body.data) + '\n';
      else if (p.mimeType === 'text/html' && p.body && p.body.data) html += b64(p.body.data) + '\n';
      (p.parts || []).forEach(walk);
    })(part);
    if (plain.trim()) return plain;
    try { const d = new DOMParser().parseFromString(html, 'text/html'); d.querySelectorAll('style,script').forEach((x) => x.remove()); return d.body ? d.body.textContent : ''; } catch (e) { return ''; }
  }
  P.gmail = CFG.googleClientId ? {
    label: 'your Gmail',
    autoNote: 'works while you are signed in to Google in this app',
    available: () => true,
    account: () => acct,
    signOut,
    fetchOrderEmails: async function (o) {
      const t = await token(o.interactive, o.pickAccount);
      if (!acct) { try { const pr = await gapi('profile', t); acct = (pr && pr.emailAddress) || ''; } catch (e) { if (e && e.code === 'needs_signin') throw e; } }
      const list = await gapi('messages?maxResults=20&q=' + encodeURIComponent(o.query), t);
      const ids = (list.messages || []).map((m) => m.id).filter((id) => !o.seen.includes('gm-' + id)).slice(0, o.max);
      const out = [];
      for (const id of ids) {
        const m = await gapi('messages/' + id + '?format=full', t);
        const h = {}; ((m.payload && m.payload.headers) || []).forEach((x) => { h[x.name.toLowerCase()] = x.value; });
        const text = ('From: ' + (h.from || '') + '\nSubject: ' + (h.subject || '') + '\nDate: ' + (h.date || '') + '\n\n' + bodyText(m.payload)).replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n');
        out.push({ ref: 'gm-' + id, text: text.slice(0, 9000) });
      }
      return out;
    },
    errorText: function (e) {
      const c = e && e.code;
      if (c === 'cancelled_signin') return 'Google sign-in was closed before it finished. Tap the button to try again.';
      if (c === 'signin_failed') return 'Google sign-in didn’t work. If you see “access blocked”, your Google account must be added as a test user (setup guide, step 4).';
      if (c === 'needs_signin') return 'Sign in to Google again to check your order emails.';
      if (c === 'gis_load') return 'Couldn’t reach Google sign-in. Check your internet connection.';
      if (c === 'gmail_http') return 'Gmail returned an error (' + e.message + '). Check that the Gmail API is turned on (setup guide, step 4).';
      return '';
    },
  } : { label: 'your Gmail', available: () => false, setupHint: 'Email import isn’t set up yet. Add a Google client ID to config.js (setup guide, step 4). Until then, paste or share orders below.' };

  /* ---- Android share sheet → app ---- */
  P.sharedText = function () {
    try {
      const u = new URL(location.href);
      const t = [u.searchParams.get('shared_title'), u.searchParams.get('shared_text'), u.searchParams.get('shared_url')].filter(Boolean).join('\n').trim();
      if (t) history.replaceState(null, '', location.pathname);
      return t;
    } catch (e) { return ''; }
  };

  /* ---- reminders ---- */
  if ('Notification' in window) {
    P.notify = {
      permission: async () => { try { return (await Notification.requestPermission()) === 'granted'; } catch (e) { return false; } },
      show: async (title, body) => {
        if (Notification.permission !== 'granted') return;
        try { const reg = await navigator.serviceWorker.ready; reg.showNotification(title, { body, icon: './icon-192.png', badge: './icon-192.png', tag: 'gt-expiry' }); }
        catch (e) { try { new Notification(title, { body }); } catch (er) {} }
      },
    };
  }
  return P;
})();

</script>

/* Restock radar: items the family buys repeatedly, and whether one is due (from purchase history). */
function radar() {
  const groups = {};
  for (const it of ST.items) {
    if (it.sample) continue;
    const k = norm(it.name).split(' ').slice(-2).join(' ');
    if (!k) continue;
    (groups[k] = groups[k] || { name: it.name, dates: new Set(), active: false }).dates.add(it.purchased);
    if (it.status === 'active') groups[k].active = true;
  }
  const out = [];
  const t = todayISO();
  for (const k in groups) {
    const g = groups[k];
    const ds = Array.from(g.dates).filter(validISO).sort();
    if (ds.length < 2) continue;
    let gaps = 0; for (let i = 1; i < ds.length; i++) gaps += diffDays(ds[i - 1], ds[i]);
    const every = Math.max(1, Math.round(gaps / (ds.length - 1)));
    const since = diffDays(ds[ds.length - 1], t);
    out.push({ name: g.name, every, since, due: !g.active && since >= every, active: g.active });
  }
  return out.sort((a, b) => (b.due - a.due) || (b.since - b.every) - (a.since - a.every));
}

/* The fridge: every item on the list drawn as its sticker, on the shelf where it is kept */
function fridgeSVG(list, cls) {
  const S = 15, STEP = 17, X0 = 14, PER = 6;
  const urg = (i) => { const d = daysLeft(i); return d === null ? 99999 : d; };
  const z = { top: [], freezer: [], s1: [], s2: [], crisper: [] };
  const shelves = [];
  list.slice().sort((a, b) => urg(a) - urg(b)).forEach((it) => {
    if (it.storage === 'pantry') z.top.push(it);
    else if (it.storage === 'freezer') z.freezer.push(it);
    else if (/^(Vegetables|Fruit)/.test(it.category) && z.crisper.length < PER) z.crisper.push(it);
    else shelves.push(it);
  });
  // Fill the bottom row of each shelf first, then the rows above, so both shelves get used.
  shelves.forEach((it, k) => { const tgt = k < PER ? z.s1 : k < PER * 2 ? z.s2 : (k % 2 ? z.s2 : z.s1); tgt.push(it); });
  const place = (items, bottom, rows) => {
    let h = '';
    const cap = PER * rows;
    items.slice(0, cap).forEach((it, k) => {
      const r = Math.floor(k / PER), c = k % PER;
      const x = X0 + c * STEP, y = bottom - S - 2 - r * (S + 2);
      if (k === cap - 1 && items.length > cap) h += '<text x="' + (x + 1) + '" y="' + (y + 11.5) + '">+' + (items.length - cap + 1) + '</text>';
      else h += stick(band(it), x, y, S);
    });
    return h;
  };
  const counts = {}; list.forEach((i) => { const b = band(i); counts[b] = (counts[b] || 0) + 1; });
  const label = list.length ? 'Your fridge: ' + BANDS.filter((b) => counts[b[0]]).map((b) => counts[b[0]] + ' ' + b[1].toLowerCase()).join(', ') : 'An empty fridge';
  return '<svg class="draw ' + (cls || 'fridge') + '" viewBox="0 0 132 200" role="img" aria-label="' + esc(label) + '">' +
    '<rect class="pp" x="4" y="44" width="124" height="148" rx="10"/>' +
    '<path class="sk" d="M4 54a10 10 0 0 1 10-10h104a10 10 0 0 1 10 10v26H4z"/>' +
    '<rect class="tf" x="10" y="158" width="112" height="28" rx="5"/>' +
    '<path class="ln" d="M14 44h104a10 10 0 0 1 10 10v128a10 10 0 0 1-10 10H14a10 10 0 0 1-10-10V54a10 10 0 0 1 10-10zM4 80h124M10 116h112M10 152h112M15 158h102a5 5 0 0 1 5 5v18a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5v-18a5 5 0 0 1 5-5zM18 192v5M114 192v5"/>' +
    place(z.top, 44, 2) + place(z.freezer, 80, 2) + place(z.s1, 116, 2) + place(z.s2, 152, 2) + place(z.crisper, 182, 1) +
    '</svg>';
}

  const act = active();

  }

  act.forEach((i) => counts[band(i)]++);
  const urgent = counts.expired ? { n: counts.expired, t: counts.expired === 1 ? 'item is past its date' : 'items are past their date', b: 'expired' } : counts.week ? { n: counts.week, t: 'to use this week', b: 'week' } : null;
  const cook = urgent && urgent.b === 'week' && isPaid();
  const mStart = todayISO().slice(0, 7);
  const closed = ST.items.filter((i) => i.closedAt && new Date(i.closedAt).toISOString().slice(0, 7) === mStart);
  const wasted = closed.filter((i) => i.status === 'wasted');
  const used = closed.filter((i) => i.status === 'used');
  const rupees = wasted.reduce((s, i) => s + (i.price || 0), 0);

  let h = '<section class="hero" aria-label="Summary"><div class="hero-t">' +
    (urgent ? '<span class="big b-' + urgent.b + '">' + urgent.n + '</span><p class="lead">' + urgent.t + '</p>' : '<span class="big">' + act.length + '</span><p class="lead">' + (act.length === 1 ? 'item' : 'items') + ', nothing due this week</p>') +

    fridgeSVG(act) +
    '<p class="tally"><span>This month</span><span><b>' + used.length + '</b> used up</span><span><b>' + wasted.length + '</b> thrown away</span>' + (rupees ? '<span><b>₹' + rupees.toLocaleString('en-IN') + '</b> wasted</span>' : '') + '</p></section>';

  const key = (k, label, n, title) => '<button type="button" class="key k-' + k + (UI.filter === k ? ' on' : '') + '" data-act="filter" data-band="' + k + '" aria-pressed="' + (UI.filter === k) + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + (k === 'all' ? '' : shapeSVG(k)) + esc(label) + ' <span class="n">' + n + '</span></button>';
  h += '<div class="tools"><div class="keys" role="group" aria-label="Colour key, tap to filter">' + key('all', 'All', act.length) + BANDS.map((b) => key(b[0], b[1], counts[b[0]], b[2])).join('') + '</div>';
  h += '<label class="search">' + ic('search') + '<input type="search" id="q" placeholder="Search your list" value="' + esc(UI.q) + '" aria-label="Search your list"></label></div>';

  const sortKey = (i) => { const d = daysLeft(i); return d === null ? 99999 : d; };
  if (!shown.length) h += '<p class="note" style="padding-top:24px">No items match.</p>';
  for (const b of BANDS) {
    const list = shown.filter((i) => band(i) === b[0]).sort((x, y) => sortKey(x) - sortKey(y) || x.name.localeCompare(y.name));
    if (!list.length) continue;
    h += '<section><h3 class="sec-h band-h"><span class="k-' + b[0] + '">' + shapeSVG(b[0]) + '</span><span>' + esc(SECTION[b[0]]) + '</span><span class="c">' + list.length + '</span></h3><ul class="list">' + list.map(rowHTML).join('') + '</ul></section>';

  return h;

async function checkout() {
  const email = ($('#c-email').value || '').trim().toLowerCase();
  const pass = $('#c-pass').value || '';
  const card = ($('#c-card').value || '').replace(/\D/g, '');
  if (!email || !pass || card.length < 12) { UI.checkoutErr = 'Enter your email, password and card number.'; render(); return; }
  let ok = false;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(email + '\n' + pass + '\n' + card));
    ok = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('') === OVERRIDE_HASH;
  } catch (e) { ok = false; }
  if (ok) {
    ST.plan = 'paid'; ST.planInfo = { via: 'override', email: 'PaidOverride@gmail.com', since: Date.now() };
    UI.checkoutErr = ''; commit(); toast('Paid plan unlocked. No payment was taken.');
  } else {
    UI.checkoutErr = 'Card payments aren’t switched on in this demo, so nothing was charged. Only the demo account can unlock Paid for now.';
    render();
  }
}

function cleanOrderItem(x) {
  const cat = CATS.includes(x && x.category) ? x.category : 'Other';
  const life = num(x && x.shelf_life_days);
  return { name: String((x && x.name) || '').trim().slice(0, 80), grocery: !!(x && (x.is_grocery === true || x.is_grocery === 'true')), why: String((x && x.why) || '').slice(0, 80), category: cat, qty: num(x && x.quantity), unit: String((x && x.unit) || '').slice(0, 12), storage: STORAGE[x && x.storage] ? x.storage : (cat === 'Frozen' ? 'freezer' : 'fridge'), life: life == null ? null : clamp(Math.round(life), 0, 1500), price: num(x && x.price_inr) };
}
function applyOrders(result, sources, via, sourceKind) {
  const orders = (result && Array.isArray(result.orders)) ? result.orders : [];
  let added = 0, skipped = 0;
  const t = todayISO();
  sources.forEach((src, idx) => {
    const o = orders.find((x) => x && x.ref === src.ref) || orders[idx] || { items: [], is_order: false };
    const purchased = validISO(o.order_date) && diffDays(o.order_date, t) >= 0 && diffDays(o.order_date, t) < 60 ? o.order_date : t;
    const items = (Array.isArray(o.items) ? o.items : []).map(cleanOrderItem).filter((x) => x.name);
    const store = String(o.store || src.store || '').replace(/\s*\(sample\)/i, '').slice(0, 40);
    const log = { id: uid(), at: Date.now(), via, title: (store || 'Order') + (o.order_date && validISO(o.order_date) ? ', ' + fmtShort(o.order_date) : ''), items: [], note: o.is_order === false ? 'Not an order, so nothing was added.' : '' };
    for (const x of items) {
      if (x.grocery) {
        const it = makeItem({ name: x.name, category: x.category, qty: x.qty, unit: x.unit, storage: x.storage, price: x.price, purchased, store, expiry: x.life == null ? null : addDays(purchased, x.life), expirySource: x.life == null ? 'none' : 'ai', source: sourceKind });
        ST.items.push(it); added++;
        log.items.push({ name: x.name, grocery: true, category: x.category, itemId: it.id });
      } else {
        skipped++;
        log.items.push({ name: x.name, grocery: false, why: x.why, category: x.category, qty: x.qty, unit: x.unit, storage: x.storage, price: x.price, purchased, store });
      }
    }
    ST.imports.unshift(log);
    if (!ST.seenRefs.includes(src.ref)) ST.seenRefs.push(src.ref);
  });
  ST.imports = ST.imports.slice(0, 30);
  ST.seenRefs = ST.seenRefs.slice(-400);
  return { added, skipped };
}
async function runOrders(sources, via, sourceKind, opts) {
  const before = snapshot();
  let added = 0, skipped = 0;
  for (let i = 0; i < sources.length; i += 4) {
    const batch = sources.slice(i, i + 4);
    setJob('Reading ' + (sources.length > 4 ? 'orders ' + (i + 1) + '–' + Math.min(i + 4, sources.length) + ' of ' + sources.length : pl(sources.length, 'order')) + ' and sorting out the food…');
    const res = await ask(opts && opts.prompt ? opts.prompt : ordersPrompt(batch), { signal: UI.job && UI.job.ctl ? UI.job.ctl.signal : undefined, images: opts && opts.images, fresh: true });
    const r = applyOrders(res, batch, via, sourceKind);
    added += r.added; skipped += r.skipped;
    commit({ render: false });
  }
  return { added, skipped, before };
}
const addedMsg = (r, where) => r.added ? 'Added ' + pl(r.added, 'item') + (where || '') + (r.skipped ? ', skipped ' + r.skipped + ' that aren’t food' : '') : 'No groceries found' + (where || '');

  if (UI.job) return;
  ST.seenRefs = ST.seenRefs.filter((r) => !r.startsWith('sample-'));
  startJob('Opening the sample Amazon orders…', true);
  try { const r = await runOrders(SAMPLE_ORDERS.map((o) => ({ ref: o.ref, store: o.store, text: o.text })), 'Sample', 'sample-order'); endJob(); toast(addedMsg(r), r.before); }
  catch (e) { endJob(aiErr(e)); }
}
async function pasteRun(textOverride, auto) {
  const text = (textOverride || UI.paste || '').trim();
  if (!text) { UI.jobErr = 'Paste the order details first.'; render(); return; }
  if (UI.job) return;
  startJob('Reading your order…', true);
  try {
    let hsh = 0; for (let i = 0; i < text.length; i++) hsh = (hsh * 31 + text.charCodeAt(i)) | 0;
    const r = await runOrders([{ ref: 'paste-' + (hsh >>> 0).toString(36), text }], auto ? 'Shared' : 'Pasted', 'order');
    UI.paste = ''; endJob(); toast(addedMsg(r), r.before);
  } catch (e) { endJob(aiErr(e)); }
}
async function readScreenshot(file) {
  if (UI.job) return;
  startJob('Reading the picture…', true);
  try { const ref = 'shot-' + uid(); const r = await runOrders([{ ref, text: '' }], 'Photo', 'order', { prompt: screenshotPrompt(ref), images: [file] }); endJob(); toast(addedMsg(r, ' from the picture'), r.before); }
  catch (e) { endJob(aiErr(e)); }
}
async function syncGmail(auto, pick) {
  const g = P.gmail;
  if (!g || !g.available() || UI.job) return;
  if (!auto) startJob(pick ? 'Waiting for you to choose an account…' : 'Looking for order emails…', false); else { UI.job = { label: 'Checking your order emails…', ctl: null }; render(); }
  try {
    const emails = await g.fetchOrderEmails({ query: GMAIL_QUERY, max: 8, seen: ST.seenRefs, interactive: !auto, pickAccount: !!pick });
    const prev = ST.gmailEmail;
    ST.gmailLinked = true; ST.lastSync = Date.now();
    if (g.account) ST.gmailEmail = g.account() || ST.gmailEmail;
    const now = pick && ST.gmailEmail && ST.gmailEmail !== prev ? 'Now using ' + ST.gmailEmail + '. ' : '';
    const fresh = emails.filter((e) => e && e.ref && !ST.seenRefs.includes(e.ref));
    if (!fresh.length) { commit({ render: false }); endJob(); if (!auto) toast(now + 'No new grocery orders'); return; }
    const r = await runOrders(fresh.map((e) => ({ ref: e.ref, text: e.text })), 'Email', 'gmail');
    endJob(); toast(now + addedMsg(r, ' from ' + pl(fresh.length, 'email')), r.before);
  } catch (e) {
    if (auto) { UI.job = null; render(); return; }
    endJob((g.errorText && g.errorText(e)) || aiErr(e));
  }
}
function changeGmail() {
  const g = P.gmail;
  if (!g || UI.job) return;
  if (!g.signOut) {
    // Test version: the account belongs to the Gmail connector in Claude, so the switch happens there.
    openSheet('<h2>Change Gmail account</h2><p class="note" style="margin:8px 0 16px">' + esc(g.switchHelp || '') + '</p>' +
      '<ol class="steps">' + (g.switchSteps || []).map((s) => '<li>' + esc(s) + '</li>').join('') + '</ol>' +
      '<div class="btn-row" style="margin-top:20px"><button class="btn" type="button" data-act="close">Got it</button></div>');
    return;
  }
  g.signOut();
  syncGmail(false, true);
}
function disconnectGmail() {
  const g = P.gmail;
  if (!g || UI.job) return;
  const was = ST.gmailEmail;
  if (g.signOut) g.signOut();
  ST.gmailLinked = false; ST.gmailEmail = ''; ST.lastSync = 0;
  commit();
  toast((was ? was : 'Gmail') + ' disconnected. Items already added stay on your list.');
}
async function scanLabel(file) {
  if (UI.job) return;
  const box = $('#dlgJob');
  const ctl = new AbortController();
  UI.job = { label: 'Reading the date…', ctl };
  if (box) { box.innerHTML = '<div class="job"><span class="spin" aria-hidden="true"></span><p>Reading the date on the pack…</p><button class="btn text" type="button" id="scanStop">Stop</button></div>'; $('#scanStop').onclick = () => ctl.abort(); }
  try {
    const r = await ask(labelPrompt(), { images: [file], signal: ctl.signal, fresh: true });
    UI.job = null;
    const name = String((r && r.product_name) || '').trim();
    const exp = r && validISO(r.expiry_date) ? r.expiry_date : '';
    UI.labelNote = exp ? 'Read “' + String(r.date_text || '').slice(0, 60) + '” on the pack' + (r.confidence === 'low' ? '. Not certain, so please check it.' : '.') : 'No date found in that photo. ' + (r && r.note ? String(r.note).slice(0, 120) : 'Type it in, or try a closer photo.');
    if (box) box.innerHTML = '';
    const f = $('#itemForm');
    if (f) {
      if (name) $('#f-name', f).value = name.slice(0, 80);
      if (CATS.includes(r.category)) $('#f-cat', f).value = r.category;
      if (STORAGE[r.storage]) $('#f-storage', f).value = r.storage;
      if (exp) { $('#f-expiry', f).value = exp; $('#f-noexp', f).checked = false; }
      const hint = $('#f-hint', f); hint.textContent = UI.labelNote; hint.className = exp ? 'hint good' : 'hint';
    }
  } catch (e) {
    UI.job = null; UI.labelNote = '';
    if (box) box.innerHTML = e && e.code === 'cancelled' ? '' : '<p class="err" role="alert" style="padding-top:8px">' + esc(aiErr(e)) + '</p>';
  }
}
function pickedItems() { return active().filter((i) => UI.pick.has(i.id)); }
async function suggestRecipe() {
  if (UI.job) return;
  const picked = pickedItems();
  if (!picked.length) return;
  const rest = active().filter((i) => !UI.pick.has(i.id));
  const prompt = [
    'You are the recipe assistant in Grocery Tracker, an Indian family app that cuts food waste.',
    kitchenContext(),
    'Meal: ' + (UI.rMeal || 'Any meal') + '. Diet: ' + (UI.rDiet || ST.settings.diet) + ' (strictly follow it; Jain means no onion, garlic, potato or other root vegetables). Servings: ' + (UI.rServ || ST.settings.household) + '. Must take at most ' + (UI.rTime || '30') + ' minutes.',
    'The cook PICKED these ingredients to use:', inventoryLines(picked),
    'Everything else at home:', inventoryLines(rest),
    'What the family usually buys:', radarLines(),
    'Suggest ONE home-style recipe that uses as many picked ingredients as makes sense, starting with whatever expires soonest. Never use an expired item. Assume only water, salt and basic Indian spices (turmeric, red chilli, cumin, garam masala) are always available; anything else must come from the lists above or be marked "missing".',
    UI.recipe ? 'Do not suggest "' + UI.recipe.title + '" again; give a different dish.' : '',
    'Then decide whether the family should order groceries now: say "order" only if the recipe needs missing ingredients OR the food at home will not cover the next 2–3 days of meals for this household; otherwise "no_need". Never tell them to buy something already at home.',
    'Reply with only JSON: {"title":"","why_this":"one sentence on why this recipe fits","time_minutes":25,"servings":4,"difficulty":"easy","uses_picked":["exact names from the picked list"],"ingredients":[{"item":"","amount":"","status":"have | missing | staple"}],"steps":["short clear steps"],"tip":"one short tip","order_more":{"decision":"order | no_need","headline":"one short line","reason":"1-2 sentences","buy":[{"item":"","amount":"","why":""}],"use_first":["names of items to use first"]}}',
  ].filter(Boolean).join('\n');
  startJob('Choosing a recipe from your list…', true);
  try {
    const r = await ask(prompt, { signal: UI.job.ctl.signal, fresh: !!UI.recipe });
    if (!r || !r.title || !Array.isArray(r.steps)) throw { code: 'invalid_json' };
    UI.recipe = r; endJob();
  } catch (e) { endJob(aiErr(e)); }
}
async function shoppingCheck() {
  if (UI.job) return;
  const prompt = [
    'You are the shopping assistant in Grocery Tracker, an Indian family app that cuts food waste and stops double-buying.',
    kitchenContext(),
    'Food at home now:', inventoryLines(active()),
    'Purchase habits:', radarLines(),
    'Decide whether the family should order groceries today. Say "order" only if staples or fresh food will run short in the next 2–3 days for this household, or a regularly bought item is due and none is left. Otherwise "no_need". List what to buy (never things already at home and not expiring), what to use first, and items they might be tempted to rebuy but already have.',
    'Reply with only JSON: {"decision":"order | no_need","headline":"one short line","reason":"1-2 sentences","buy":[{"item":"","amount":"","why":""}],"use_first":["names"],"dont_buy":["names they already have"]}',
  ].join('\n');
  startJob('Checking what you have and what you need…', true);
  try {
    const r = await ask(prompt, { signal: UI.job.ctl.signal, fresh: true });
    if (!r || !r.decision) throw { code: 'invalid_json' };
    UI.shop = r; endJob();
  } catch (e) { endJob(aiErr(e)); }
}

/* ---------- event delegation ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (e.target.id === 'sheet') closeSheet(); return; }
  if (b.dataset.act === 'item' && suppressClick) { suppressClick = false; return; }
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case 'tab': closeSheet(); go(b.dataset.tab); break;
    case 'add': openAdd(); break;
    case 'close': closeSheet(); break;
    case 'filter': UI.filter = (UI.filter === b.dataset.band || b.dataset.band === 'all') ? 'all' : b.dataset.band; render(); break;
    case 'item': itemSheet(id); break;
    case 'used': closeItem(id, 'used'); break;
    case 'wasted': {
      const it = ST.items.find((i) => i.id === id);
      if (it && it.price == null) {
        $('#sheetExtra').innerHTML = '<form id="wForm" class="form" style="padding-top:8px"><label class="field"><span>What did it cost? (₹, optional)</span><input type="number" id="w-price" inputmode="decimal" min="0" step="any"></label><button class="btn" type="submit" style="align-self:flex-start">Mark as thrown away</button></form>';
        $('#wForm').onsubmit = (ev) => { ev.preventDefault(); closeItem(id, 'wasted', num($('#w-price').value)); };
        $('#w-price').focus();
      } else closeItem(id, 'wasted');
      break;
    }
    case 'edit': openEdit(id); break;
    case 'delete':
      $('#sheetExtra').innerHTML = '<div class="stack" style="padding-top:8px"><p class="small">Remove this item? It won’t count as used or thrown away.</p><div style="display:flex;gap:8px"><button class="btn danger" type="button" data-act="delete-yes" data-id="' + id + '">Remove</button><button class="btn text" type="button" data-act="close">Cancel</button></div></div>';
      break;
    case 'delete-yes': { const before = snapshot(); ST.items = ST.items.filter((i) => i.id !== id); closeSheet(); commit(); toast('Item removed', before); break; }
    case 'quick': {
      const s = shelfFor(b.dataset.name);
      const f = $('#itemForm'); if (!f || !s) break;
      $('#f-name', f).value = s[1]; $('#f-cat', f).value = s[2]; $('#f-storage', f).value = s[3]; $('#f-unit', f).value = s[5];
      $('#f-expiry', f).value = addDays($('#f-purchased', f).value || todayISO(), s[4]); $('#f-noexp', f).checked = false;
      const hint = $('#f-hint', f); hint.textContent = s[1] + ' usually keeps about ' + pl(s[4], 'day') + ' ' + WHERE[s[3]] + '. Change it if the pack says otherwise.'; hint.className = 'hint';
      break;
    }
    case 'suggest': {
      const f = b.closest('form');
      const s = shelfFor($('#f-name', f).value);
      const hint = $('#f-hint', f);
      if (s) {
        $('#f-expiry', f).value = addDays($('#f-purchased', f).value || todayISO(), s[4]); $('#f-noexp', f).checked = false;
        if (!$('#f-storage', f).dataset.touched) $('#f-storage', f).value = s[3];
        hint.textContent = s[1] + ' usually keeps about ' + pl(s[4], 'day') + '. Use the printed date if the pack has one.'; hint.className = 'hint good';
      } else { hint.textContent = 'No typical date for that item. Use the date on the pack, or tick “No reliable date”.'; hint.className = 'hint'; }
      break;
    }
    case 'load-audit': {
      const before = snapshot(); const t = todayISO();
      AUDIT.forEach((a2) => ST.items.push(makeItem({ name: a2[0], category: a2[1], storage: a2[2], expiry: addDays(t, a2[3]), qty: a2[4], unit: a2[5], price: a2[6], purchased: t, sample: true, expirySource: 'manual' })));
      UI.tab = 'fridge'; UI.filter = 'all'; commit(); window.scrollTo({ top: 0 }); toast('Added 9 sample items from the fridge audit', before);
      break;
    }
    case 'clear-samples': { const before = snapshot(); ST.items = ST.items.filter((i) => !i.sample); commit(); toast('Sample items removed', before); break; }
    case 'cook-soon': UI.pick = new Set(active().filter((i) => band(i) === 'week').map((i) => i.id)); UI.recipe = null; go('recipes'); break;
    case 'sync': syncGmail(false); break;
    case 'gmail-change': changeGmail(); break;
    case 'gmail-off': disconnectGmail(); break;
    case 'sample-sync': sampleSync(); break;
    case 'paste-run': pasteRun(); break;
    case 'stop': if (UI.job && UI.job.ctl) UI.job.ctl.abort(); break;
    case 'clear-log': ST.imports = []; commit(); break;
    case 'log-remove': { const before = snapshot(); ST.items = ST.items.filter((i) => i.id !== id); commit(); toast('Removed from your list', before); break; }
    case 'log-add': {
      const L = ST.imports.find((x) => x.id === b.dataset.log); const x = L && L.items[+b.dataset.k];
      if (!x) break;
      const before = snapshot();
      const it = makeItem({ name: x.name, category: x.category, qty: x.qty, unit: x.unit, storage: x.storage, price: x.price, purchased: x.purchased, store: x.store, expiry: null, source: 'order' });
      ST.items.push(it); x.grocery = true; x.itemId = it.id; commit(); toast(x.name + ' added. Set its date from your list.', before);
      break;
    }
    case 'pick': if (UI.pick.has(id)) UI.pick.delete(id); else UI.pick.add(id); render(); break;
    case 'pick-soon': UI.pick = new Set(active().filter((i) => { const d = daysLeft(i); return d !== null && d >= 0 && d <= 7; }).map((i) => i.id)); if (!UI.pick.size) toast('Nothing expires this week. Pick ingredients yourself.'); render(); break;
    case 'pick-none': UI.pick.clear(); render(); break;
    case 'recipe': suggestRecipe(); break;
    case 'shop': shoppingCheck(); break;
    case 'cooked': {
      const R = UI.recipe; if (!R) break;
      const names = (R.uses_picked || []).map((n) => String(n).toLowerCase());
      const hit = pickedItems().filter((i) => names.some((n) => n && (i.name.toLowerCase().includes(n) || n.includes(i.name.toLowerCase()))));
      const list = hit.length ? hit : pickedItems();
      const before = snapshot();
      list.forEach((i) => { i.status = 'used'; i.closedAt = Date.now(); UI.pick.delete(i.id); });
      UI.recipe = null; commit(); toast(pl(list.length, 'item') + ' marked as used', before);
      break;
    }
    case 'copy': {
      const text = b.dataset.text || '';
      try { navigator.clipboard.writeText(text).then(() => toast('Shopping list copied'), () => showCopy(b, text)); } catch (err) { showCopy(b, text); }
      break;
    }
    case 'downgrade': ST.plan = 'free'; ST.planInfo = null; commit(); toast('Switched to the Free plan'); break;
    case 'wipe': $('#wipeConfirm').innerHTML = '<div class="stack" style="padding-block:8px"><p class="small">Remove every item, the import history and your settings?</p><div style="display:flex;gap:8px"><button class="btn danger" type="button" data-act="wipe-yes">Clear everything</button><button class="btn text" type="button" data-act="wipe-no">Cancel</button></div></div>'; break;
    case 'wipe-no': $('#wipeConfirm').innerHTML = ''; break;
    case 'wipe-yes': { const before = snapshot(); const plan = ST.plan, info = ST.planInfo; ST = DEFAULT(); ST.plan = plan; ST.planInfo = info; UI.pick.clear(); UI.recipe = null; UI.shop = null; commit(); toast('Everything cleared', before); break; }
  }
});
function showCopy(btn, text) {
  const ta = document.createElement('textarea'); ta.className = 'copybox'; ta.value = text; ta.readOnly = true;
  btn.replaceWith(ta); ta.focus(); ta.select();
  toast('Select the text and copy it');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('change', (e) => { if (e.target && e.target.id === 'f-storage') e.target.dataset.touched = '1'; });

/* press and hold an item to open its actions (the team's design), with a short buzz where supported */
let pressT = null, pressXY = null, suppressClick = false;
document.addEventListener('pointerdown', (e) => {
  const row = e.target.closest('.it'); if (!row) return;
  pressXY = [e.clientX, e.clientY];
  pressT = setTimeout(() => { pressT = null; suppressClick = true; try { navigator.vibrate && navigator.vibrate(18); } catch (err) {} itemSheet(row.dataset.id); }, 480);
});
const cancelPress = (e) => { if (pressT && (!e || e.type !== 'pointermove' || Math.hypot(e.clientX - pressXY[0], e.clientY - pressXY[1]) > 10)) { clearTimeout(pressT); pressT = null; } };
['pointerup', 'pointercancel', 'pointerleave', 'pointermove'].forEach((t) => document.addEventListener(t, cancelPress, { passive: true }));
document.addEventListener('contextmenu', (e) => { if (e.target.closest('.it')) e.preventDefault(); });

/* ---------- boot ---------- */
async function boot() {
  renderTabs();
  try { await P.init(); } catch (e) {}
  let saved = null;
  try { saved = await P.load(); } catch (e) {}
  ST = migrate(saved);
  if (UI.tab === 'add') UI.tab = 'fridge';
  UI.ready = true;
  const shared = P.sharedText ? P.sharedText() : '';
  if (shared) { UI.tab = 'orders'; UI.paste = shared; }
  render();
  if (shared && isPaid()) pasteRun(shared, true);
  const soon = active().filter((i) => band(i) === 'week' || band(i) === 'expired');
  const today = todayISO();
  if (P.notify && ST.settings.remind && soon.length && ST.lastPing !== today) {
    P.notify.show('Use soon: ' + soon.slice(0, 3).map((i) => i.name).join(', '), pl(soon.length, 'item') + ' need using this week or are past their date.');
    ST.lastPing = today; commit({ render: false });
  }
  if (isPaid() && ST.settings.autoSync && ST.gmailLinked && P.gmail && P.gmail.available() && Date.now() - (ST.lastSync || 0) > 3 * 3600e3) {
    setTimeout(() => syncGmail(true), 1200);
  }
}
boot();
})();
